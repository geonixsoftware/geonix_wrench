name: Release

# Builds the three desktop downloads offered on the website and attaches them
# to a GitHub Release. Each one has to be built on its own OS — Windows and
# Linux cannot be cross-compiled from a Mac, which is the whole reason this
# runs in CI rather than on someone's laptop.
#
# iOS and Android are deliberately absent: they ship through the App Store and
# Google Play, so there is no file for the website to link to.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.0)"
        required: true

env:
  # Release assets are published to the *public* website repo, not to this one.
  # Assets on a private repo are not downloadable without a token, which would
  # break every download link on the site. Needs a RELEASE_TOKEN secret: a PAT
  # with `contents: write` on the target repo (GITHUB_TOKEN cannot write to
  # another repository).
  RELEASE_REPO: geonixsoftware/geonix

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

  macos:
    name: macOS (.dmg)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        working-directory: geonix_wrench_app
        run: |
          flutter pub get
          flutter build macos --release

      # The .app is ad-hoc signed (CODE_SIGN_IDENTITY = "-"), so Gatekeeper
      # will refuse to open it on someone else's machine until it is signed
      # with a Developer ID Application certificate and notarized. To do that,
      # add the cert to the runner keychain and insert `codesign --deep
      # --options runtime` + `xcrun notarytool submit` between these two steps.
      - name: Package .dmg
        run: |
          set -euo pipefail
          APP="geonix_wrench_app/build/macos/Build/Products/Release/geonix_wrench_app.app"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist
          # The bundle is renamed for display only; CFBundleExecutable still
          # points at the geonix_wrench_app binary inside, so this is safe.
          cp -R "$APP" "$STAGE/Geonix Wrench.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Geonix Wrench" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "dist/geonix-wrench-${{ needs.version.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # windows/CMakeLists.txt still declares cmake_minimum_required(VERSION
      # 3.14), and CMake 4.x refuses anything below 3.5 outright. `flutter
      # build windows` invokes CMake itself and forwards no -D flags, so the
      # policy floor goes in through the environment variable CMake reads into
      # the same cache entry as -DCMAKE_POLICY_VERSION_MINIMUM=3.5.
      #
      # This is a workaround, not a fix: bumping cmake_minimum_required in
      # windows/CMakeLists.txt and windows/runner/CMakeLists.txt is what
      # actually resolves it, and lets this env block go away.
      - name: Build
        working-directory: geonix_wrench_app
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Inno Setup ships on the GitHub Windows image, but pin against the
          # day it does not so the job fails loudly rather than silently.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceDir=$PWD\geonix_wrench_app\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            downloads\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux (.deb)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain plus the headers the plugin set pulls in: libsecret for
      # flutter_secure_storage, libcups for printing, GTK for the shell itself.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libcups2-dev \
            librsvg2-bin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Same CMake 4.x policy floor as the Windows job — linux/CMakeLists.txt
      # declares cmake_minimum_required(VERSION 3.13), which is below 3.5 as
      # far as CMake 4 is concerned, and `flutter build linux` forwards no -D
      # flags either. Bumping cmake_minimum_required in linux/CMakeLists.txt
      # and linux/runner/CMakeLists.txt is what removes the need for this.
      - name: Build
        working-directory: geonix_wrench_app
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package .deb
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          BUNDLE="geonix_wrench_app/build/linux/x64/release/bundle"
          ROOT="$RUNNER_TEMP/pkgroot"
          rm -rf "$ROOT"

          # The bundle keeps its own lib/ and data/ next to the binary, so it
          # goes to /opt whole rather than being scattered across /usr.
          mkdir -p "$ROOT/opt/geonix-wrench" "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/512x512/apps" \
                   "$ROOT/DEBIAN" dist
          cp -r "$BUNDLE"/. "$ROOT/opt/geonix-wrench/"
          ln -s /opt/geonix-wrench/geonix_wrench_app "$ROOT/usr/bin/geonix-wrench"

          cp downloads/linux/com.geonixsoftware.wrench.desktop \
             "$ROOT/usr/share/applications/"
          rsvg-convert -w 512 -h 512 \
            geonix_wrench_app/assets/branding/geonix_wrench_logo_light.svg \
            -o "$ROOT/usr/share/icons/hicolor/512x512/apps/com.geonixsoftware.wrench.png"

          # Hand-written rather than generated by dpkg-shlibdeps: the bundled
          # libflutter_linux_gtk.so has no shlibs info, which makes shlibdeps
          # fail on an otherwise fine package.
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: geonix-wrench
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, liblzma5, libsecret-1-0, libcups2
          Maintainer: Geonix Software <geonix.software@proton.me>
          Description: Voice-to-job-card for vehicle repair shops
           Record what was done on a vehicle and get back a structured job card
           with the vehicle, labor hours and parts.
          EOF

          dpkg-deb --root-owner-group --build "$ROOT" \
            "dist/geonix-wrench-$VERSION-linux.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          for f in *; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -lh

      # Created as a draft on purpose: the site's download links point at these
      # URLs, so nothing should be reachable until someone has installed each
      # build on a clean machine and pressed Publish.
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          name: Geonix Wrench ${{ needs.version.outputs.version }}
          draft: true
          files: dist/*
