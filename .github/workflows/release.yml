  publish:
    name: Publish release
    # `linux` removed alongside the commented-out job: a needs: entry naming a
    # job that does not exist makes the whole workflow fail to parse.
    needs: [version, android, macos, windows]
    runs-on: ubuntu-latest
    # Scoped to this job rather than the whole workflow: only the release step
    # writes anything, and the three build jobs have no reason to hold a
    # write-capable token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist

          # Unversioned aliases. The website links to
          #   /releases/latest/download/geonix-wrench-<platform>.<ext>
          # which resolves only if an asset carries exactly that name — the
          # versioned filenames cannot satisfy it. Uploading both means the site
          # never needs editing when the version changes, while the versioned
          # copy stays as the archival name people can cite.
          VERSION="${{ needs.version.outputs.version }}"
          for f in *; do
            alias_name="${f/-$VERSION-/-}"
            [ "$alias_name" = "$f" ] && continue
            cp "$f" "$alias_name"
          done

          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -lh

      # The website advertises these three by name. If a build job produced
      # nothing, the row it belongs to is a 404 the moment someone presses
      # Publish — so say so here, while the release is still a draft and the
      # person about to publish it is looking at this run.
      - name: Check every advertised download is present
        run: |
          set -uo pipefail
          missing=()
          for f in geonix-wrench-android.apk geonix-wrench-macos.dmg geonix-wrench-windows.exe; do
            [ -f "dist/$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Not built: ${missing[*]}. geonix_wrench.html links to these, so those rows will 404. Fix them, or set those rows back to 'Coming soon', before publishing."
          else
            echo "All three advertised downloads are present."
          fi

      # Created as a draft on purpose: the site's download links point at these
      # URLs, so nothing should be reachable until someone has installed each
      # build on a clean machine and pressed Publish.
      #
      # The release now lands in THIS repo. GITHUB_TOKEN is scoped to the
      # repository running the workflow, so the previous cross-repo
      # `repository: geonixsoftware/geonix` had to go with it — kept together,
      # every run would 403. That moves the asset URLs to
      # /geonixsoftware/geonix_wrench/releases/download/..., which is not what
      # the website currently links to.
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          name: Geonix Wrench ${{ needs.version.outputs.version }}
          draft: true
          files: dist/*
