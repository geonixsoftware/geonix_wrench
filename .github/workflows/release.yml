name: Release

# Builds the downloads offered on the website and attaches them to a GitHub
# Release. Each desktop target has to be built on its own OS — Windows and Linux
# cannot be cross-compiled from a Mac, which is the whole reason this runs in
# CI rather than on someone's laptop.
#
# Currently Android, macOS and Windows. The Linux job is commented out further
# down after an AOT snapshotter crash, and the website's Linux row says "Coming
# soon" to match.
#
# Android is here because the website needs a file for it: Play is a store
# listing, not a link, and a shop that wants the app today installs the .apk
# directly. iOS is the one target with no artifact at all — Apple installs only
# through the App Store or TestFlight, so there is nothing to attach.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.0)"
        required: true

env:
  # Pinned rather than floating on `stable`. Run #3 resolved five SDK-pinned
  # packages away from the committed pubspec.lock (intl, matcher, meta,
  # test_api, vector_math), which only happens when CI is on a newer SDK than
  # the lock was written against — so the release was never built from the
  # dependency set anyone had tested. 3.47.0 is what the lock matches.
  FLUTTER_VERSION: "3.47.0"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

  android:
    name: Android (.apk)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/app/build.gradle.kts throws outright if key.properties is
      # missing, by design — it refuses to fall back to the publicly known debug
      # keystore for a release build. So the real keystore is reconstructed here
      # from secrets.
      #
      # Create the four secrets once, from the keystore in
      # android/key.properties.example's instructions:
      #   ANDROID_KEYSTORE_BASE64  base64 -i upload-keystore.jks
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      #
      # Without them this job warns and produces nothing, rather than failing.
      # A hard failure here would take the macOS and Windows downloads with it,
      # since publish waits on all three — and there is no reason a missing
      # Android key should block a desktop release. The publish job re-checks
      # what actually arrived and warns about any advertised row left dead.
      - name: Restore signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so no .apk was built. The website's Android row links to this artifact and will 404 until the four ANDROID_* secrets exist."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          cd geonix_wrench_app/android
          # Written to the runner's temp dir, never into the checkout, and the
          # runner is discarded when the job ends.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        if: steps.signing.outputs.available == 'true'
        working-directory: geonix_wrench_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename artifact
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp geonix_wrench_app/build/app/outputs/flutter-apk/app-release.apk \
            "dist/geonix-wrench-${{ needs.version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Built unsigned. `flutter build macos` has no --no-codesign flag (that
      # is iOS-only, and passing it here is a hard argument-parse error), so
      # signing is turned off the supported way: flutter_tools forwards any
      # FLUTTER_XCODE_<SETTING> env var to xcodebuild as a build-setting
      # override. This sidesteps the Automatic/DEVELOPMENT_TEAM K4XDZQ5WXW
      # config in the Xcode project, which cannot resolve on a runner that has
      # no certificates in its keychain.
      - name: Build
        working-directory: geonix_wrench_app
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
        run: |
          flutter pub get
          flutter build macos --release

      # The .app is ad-hoc signed (CODE_SIGN_IDENTITY = "-"), so Gatekeeper
      # will refuse to open it on someone else's machine until it is signed
      # with a Developer ID Application certificate and notarized. To do that,
      # add the cert to the runner keychain and insert `codesign --deep
      # --options runtime` + `xcrun notarytool submit` between these two steps.
      - name: Package .dmg
        run: |
          set -euo pipefail
          APP="geonix_wrench_app/build/macos/Build/Products/Release/geonix_wrench_app.app"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist
          # The bundle is renamed for display only; CFBundleExecutable still
          # points at the geonix_wrench_app binary inside, so this is safe.
          cp -R "$APP" "$STAGE/Geonix Wrench.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Geonix Wrench" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "dist/geonix-wrench-${{ needs.version.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # windows/CMakeLists.txt still declares cmake_minimum_required(VERSION
      # 3.14), and CMake 4.x refuses anything below 3.5 outright. `flutter
      # build windows` invokes CMake itself and forwards no -D flags, so the
      # policy floor goes in through the environment variable CMake reads into
      # the same cache entry as -DCMAKE_POLICY_VERSION_MINIMUM=3.5.
      #
      # This is a workaround, not a fix: bumping cmake_minimum_required in
      # windows/CMakeLists.txt and windows/runner/CMakeLists.txt is what
      # actually resolves it, and lets this env block go away.
      - name: Build
        working-directory: geonix_wrench_app
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # permission_handler_windows pulls in <experimental/coroutine>, which
          # MSVC 14.51 turns into a hard error (STL1011). This is the macro the
          # error text itself names — it needs /D, and the leading underscore.
          #
          # /std:c++20 was tried here and does nothing: APPLY_STANDARD_SETTINGS
          # in windows/CMakeLists.txt:41 appends /std:c++17 per target, after
          # CMAKE_CXX_FLAGS, and the last standard flag on the cl command line
          # wins. Fixing the standard means editing that line, not this one.
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Inno Setup ships on the GitHub Windows image, but pin against the
          # day it does not so the job fails loudly rather than silently.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceDir=$PWD\geonix_wrench_app\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            downloads\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

